<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIU Portal - Student Login</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            padding: 20px;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo {
            height: 45px; /* controls logo size */
            width: auto;
        }

        .logo-text {
            font-size: 24px;
            font-weight: bold;
            color: white;
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            max-width: 450px;
            width: 100%;
        }

            .login-box h1 {
                color: var(--primary-color);
                text-align: center;
                margin-bottom: 10px;
            }

            .login-box p {
                text-align: center;
                color: #666;
                margin-bottom: 30px;
            }

        .form-group {
            margin-bottom: 20px;
        }

            .form-group label {
                display: block;
                margin-bottom: 8px;
                color: var(--primary-color);
                font-weight: 600;
            }

            .form-group input {
                width: 100%;
                padding: 12px;
                border: 2px solid #e0e0e0;
                border-radius: 6px;
                font-size: 14px;
                transition: border-color 0.3s;
            }

                .form-group input:focus {
                    outline: none;
                    border-color: var(--primary-color);
                }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

            .btn-primary:hover {
                background-color: var(--primary-dark);
                transform: translateY(-2px);
                box-shadow: 0 5px 15px rgba(11, 83, 69, 0.3);
            }

        .message {
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
            display: none;
            text-align: center;
            font-weight: 600;
        }

            .message.show {
                display: block;
            }

            .message.success {
                background-color: #d4edda;
                color: #155724;
                border: 1px solid #c3e6cb;
            }

            .message.error {
                background-color: #f8d7da;
                color: #721c24;
                border: 1px solid #f5c6cb;
            }

        .register-link {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

            .register-link p {
                margin: 0;
                color: #666;
                font-size: 14px;
            }

            .register-link a {
                color: var(--primary-color);
                text-decoration: none;
                font-weight: 600;
            }

                .register-link a:hover {
                    text-decoration: underline;
                }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <img src="images/MIU-logo.jpg" alt="MIU Logo" class="logo">
                <span class="logo-text">MIU Portal</span>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="login.html" class="active">Login</a></li>
                <li><a href="register.html">Register</a></li>
            </ul>
        </div>
    </nav>

    <div class="login-container">
        <div class="login-box">
            <h1>Student Login</h1>
            <p>Enter your credentials to access the portal</p>

            <div id="loginFormContainer">
                <div class="form-group">
                    <label for="email">📧 Email Address</label>
                    <input type="email"
                           id="email"
                           placeholder="your@email.com"
                           onkeypress="checkEnterKey(event)"
                           required>
                </div>

                <div class="form-group">
                    <label for="password">🔐 Password</label>
                    <input type="password"
                           id="password"
                           placeholder="Your password"
                           onkeypress="checkEnterKey(event)"
                           required>
                </div>

                <button type="button" class="btn btn-primary" onclick="handleLogin()">Login</button>
            </div>

            <div style="text-align:right; margin-top:10px;">
                <a href="forgot-password.html"
                   style="color: var(--primary-color); font-size:14px;">
                    Forgot Password?
                </a>
            </div>
            <div id="message" class="message"></div>

            <div class="register-link">
                <p>Don't have an account? <a href="register.html">Apply Now</a></p>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Metropolitan International University-students' Final project. All rights reserved.</p>
    </footer>

    <script>
        const API_URL = 'https://localhost:44366/api';

        // Custom keyboard handler for the Enter key
        function checkEnterKey(event) {
            if (event.key === 'Enter') {
                handleLogin();
            }
        }

        async function handleLogin() {
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');

            if (!emailInput || !passwordInput) return;

            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            console.log('Running clean login execution for:', email);

            if (!email || !password) {
                showMessage('⚠️ Please enter both email and password', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/auth/student-login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();
                console.log('Login response:', data);

                if (data.success && data.token) {
                    // Save token and user details to storage securely
                    localStorage.setItem('token', data.token);

                    const userProfile = data.data || data.user || {};
                    localStorage.setItem('student', JSON.stringify(userProfile));

                    showMessage('✅ Login successful! Redirecting...', 'success');

                    // Immediately move positions to guarantee a transition without waiting for timers
                    window.location.replace("student-dashboard.html");

                } else {
                    showMessage('❌ ' + (data.message || 'Login failed'), 'error');
                }
            } catch (error) {
                console.error('Login error details:', error);
                showMessage('❌ Error connecting to server: ' + error.message, 'error');
            }
        }

        function showMessage(message, type) {
            const messageDiv = document.getElementById('message');
            if (!messageDiv) return;

            messageDiv.textContent = message;
            messageDiv.className = `message show ${type}`;

            setTimeout(() => {
                messageDiv.classList.remove('show');
            }, 5000);
        }
    </script>
</body>
</html>
