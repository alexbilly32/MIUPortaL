<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIU Portal - Admin Login</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-container {
            display: flex;
            height: 100vh;
            background: linear-gradient(135deg, #0B5345 0%, #1a8570 100%);
        }

        .login-left {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .login-right {
            flex: 1;
            background: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
        }

        .logo {
            color: white;
            text-align: center;
            margin-bottom: 40px;
        }

            .logo h1 {
                font-size: 48px;
                margin: 0;
            }

            .logo p {
                font-size: 18px;
                margin-top: 10px;
            }

        .admin-title {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 30px;
        }

            .admin-title h2 {
                margin: 0;
                font-size: 28px;
            }

            .admin-title p {
                color: #999;
                font-size: 14px;
                margin: 5px 0 0 0;
            }

        .form-group {
            margin-bottom: 20px;
        }

            .form-group label {
                display: block;
                margin-bottom: 8px;
                color: var(--primary-color);
                font-weight: 600;
            }

            .form-group input {
                width: 100%;
                padding: 12px;
                border: 2px solid #e0e0e0;
                border-radius: 6px;
                font-size: 16px;
            }

                .form-group input:focus {
                    outline: none;
                    border-color: var(--primary-color);
                }

        .message {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }

            .message.show {
                display: block;
            }

            .message.success {
                background: #d4edda;
                color: #155724;
            }

            .message.error {
                background: #f8d7da;
                color: #721c24;
            }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

            .btn-login:hover {
                background: var(--primary-dark);
                transform: translateY(-2px);
            }

            .btn-login:disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

            .back-link a {
                color: var(--primary-color);
                text-decoration: none;
                font-weight: 600;
            }

        @media (max-width: 768px) {
            .login-container {
                flex-direction: column;
            }

            .login-left {
                padding: 20px;
            }

            .login-right {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-left">
            <div class="logo">
                <img src="images/MIU-logo.jpg" alt="MIU Logo" class="logo" >
                <h1>Metropolitan International University (MIU)</h1>
                <p style="margin-top: 20px; font-size: 28px;">Admin Portal</p>
            </div>
        </div>

        <div class="login-right">
            <div class="login-box">
                <div class="admin-title">
                    <h2>Admin Login</h2>
                    <p>Access the admin dashboard</p>
                </div>

                <div id="message" class="message"></div>

                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="email">Admin Email</label>
                        <input type="email" id="email" placeholder="admin@miu.ac.ug" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Enter password" required>
                    </div>

                    <button type="submit" class="btn-login" id="loginBtn">Login</button>
                </form>

                <div class="back-link">
                    <a href="index.html">← Back to Home</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://localhost:44366/api';

        async function handleLogin(event) {
            event.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const messageDiv = document.getElementById('message');

            if (!email || !password) {
                showMessage('Please fill in all fields', 'error');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = 'Logging in...';

            try {
                const response = await fetch(`${API_URL}/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('adminToken', data.token);
                    localStorage.setItem('adminUser', JSON.stringify(data.user));
                    showMessage('✅ Login successful! Redirecting...', 'success');

                    setTimeout(() => {
                        window.location.href = 'admin-dashboard.html';
                    }, 1500);
                } else {
                    showMessage('❌ ' + (data.message || 'Login failed'), 'error');
                }
            } catch (error) {
                showMessage('❌ Error: ' + error.message, 'error');
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login';
            }
        }

        function showMessage(msg, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = msg;
            messageDiv.className = `message show ${type}`;

            setTimeout(() => {
                messageDiv.classList.remove('show');
            }, 5000);
        }
    </script>
</body>
</html>
