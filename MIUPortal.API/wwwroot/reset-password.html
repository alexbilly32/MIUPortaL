<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/lib/bootstrap-icons/bootstrap-icons.min.css">

    <title>
        MIU Portal - Reset Password
    </title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: 'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
            min-height: 100vh;
            background: linear-gradient( 135deg, #0B5345, #1a8570 );
            display: flex;
            justify-content: center;
            align-items: center;
        }



        .container {
            width: 420px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,.3);
        }



        h2 {
            text-align: center;
            color: #0B5345;
            margin-bottom: 15px;
        }



        p.description {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }



        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }



            input:focus {
                outline: none;
                border-color: #0B5345;
            }



        button {
            width: 100%;
            padding: 14px;
            background: #0B5345;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }



            button:disabled {
                opacity: .6;
                cursor: not-allowed;
            }



        .message {
            margin-top: 20px;
            text-align: center;
            font-weight: 600;
        }



        .success {
            color: green;
        }



        .error {
            color: red;
        }



        a {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #0B5345;
        }
    </style>

</head>

<body>

    <div class="container">

        <h2>
            🔐 Reset Password
        </h2>

        <p class="description">
            Create a new secure password for your MIU Portal account.
        </p>

        <input type="password"
               id="password"
               placeholder="New Password (minimum 8 characters)">

        <input type="password"
               id="confirmPassword"
               placeholder="Confirm New Password">

        <button id="resetBtn"
                onclick="resetPassword()">

            Reset Password

        </button>

        <div id="message" class="message"></div>

        <a href="login.html">
            ← Back to Login
        </a>

    </div>

    <script>


        const API_URL =
            'https://localhost:44366/api';





        async function resetPassword() {



            const params =
                new URLSearchParams(window.location.search);



            const token =
                params.get("token");



            const password =
                document.getElementById("password").value;



            const confirmPassword =
                document.getElementById("confirmPassword").value;



            const button =
                document.getElementById("resetBtn");



            const message =
                document.getElementById("message");




            if (!token) {


                message.className = "message error";

                message.innerText =
                    "❌ Invalid password reset link.";

                return;

            }





            if (password.length < 8) {


                message.className = "message error";

                message.innerText =
                    "Password must contain at least 8 characters.";

                return;


            }





            if (password !== confirmPassword) {


                message.className = "message error";

                message.innerText =
                    "Passwords do not match.";

                return;


            }




            button.disabled = true;

            button.innerText = "Resetting...";





            try {


                const response =
                    await fetch(`${API_URL}/auth/reset-password`, {


                        method: "POST",


                        headers: {


                            "Content-Type": "application/json"


                        },


                        body: JSON.stringify({

                            token: token,

                            newPassword: password

                        })


                    });





                const data =
                    await response.json();





                if (data.success) {


                    message.className = "message success";


                    message.innerText =
                        "✅ Password reset successful. Redirecting to login...";



                    setTimeout(() => {


                        window.location.href = "login.html";


                    }, 3000);



                }

                else {


                    message.className = "message error";


                    message.innerText =
                        data.message ||
                        "Password reset failed.";


                }




            }

            catch (error) {


                message.className = "message error";


                message.innerText =
                    "❌ Unable to connect to server.";


                console.error(error);


            }



            finally {


                button.disabled = false;

                button.innerText = "Reset Password";


            }




        }



    </script>

</body>

</html>
