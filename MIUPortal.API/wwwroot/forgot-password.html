<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/lib/bootstrap-icons/bootstrap-icons.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIU Portal - Forgot Password</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #154360, #117864);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 420px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,.3);
        }

        .logo-circle {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #117864, #154360);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
        }

        h2 {
            text-align: center;
            color: #154360;
            margin-bottom: 15px;
        }

        p.description {
            text-align: center;
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

            input:focus {
                outline: none;
                border-color: #117864;
            }

        button {
            width: 100%;
            padding: 14px;
            background: #117864;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

            button:hover {
                background: #154360;
            }

            button:disabled {
                opacity: .6;
                cursor: not-allowed;
            }

        .message {
            margin-top: 20px;
            text-align: center;
            font-weight: 600;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #154360;
        }

            a:hover {
                text-decoration: underline;
            }

        @media (max-width: 480px) {
            .container {
                width: 95%;
                padding: 30px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="logo-circle">🔐</div>

        <h2>Forgot Password?</h2>

        <p class="description">
            Enter your registered MIU Portal email address.
            A secure password reset link will be sent to your email.
        </p>

        <input type="email"
               id="email"
               placeholder="Enter registered email address">

        <button id="resetBtn" onclick="sendResetLink()">
            Send Reset Link
        </button>

        <div id="message" class="message"></div>

        <a href="login.html">← Back to Login</a>

    </div>

    <script>
        const API_URL = 'https://localhost:44366/api';

        async function sendResetLink() {
            const email = document.getElementById("email").value.trim();
            const button = document.getElementById("resetBtn");
            const message = document.getElementById("message");

            if (!email) {
                message.className = "message error";
                message.innerText = "Please enter your email address.";
                return;
            }

            button.disabled = true;
            button.innerText = "Sending...";

            try {
                const response = await fetch(`${API_URL}/auth/forgot-password`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: email })
                });

                const data = await response.json();

                if (data.success) {
                    message.className = "message success";
                    message.innerText = "✅ Reset link sent successfully. Please check your email.";
                } else {
                    message.className = "message error";
                    message.innerText = data.message || "Unable to process request.";
                }
            } catch (error) {
                message.className = "message error";
                message.innerText = "❌ Unable to connect to server.";
                console.error(error);
            } finally {
                button.disabled = false;
                button.innerText = "Send Reset Link";
            }
        }
    </script>

</body>
</html>
