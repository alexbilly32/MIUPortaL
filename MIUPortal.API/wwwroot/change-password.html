<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIU Portal - Set Password</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="/lib/bootstrap-icons/bootstrap-icons.min.css">

    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg,#0B5345,#1a8570);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .password-container {
            background: white;
            width: 420px;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 20px 50px rgba(0,0,0,.25);
        }

        h2 {
            text-align: center;
            color: #0B5345;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #0B5345;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

            input:focus {
                outline: none;
                border-color: #0B5345;
                box-shadow: 0 0 0 3px rgba(11,83,69,.15);
            }

        button {
            width: 100%;
            padding: 14px;
            background: #0B5345;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }

            button:hover {
                background: #073D35;
            }

        .requirements {
            background: #f4f7f9;
            padding: 15px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
        }

            .requirements li {
                margin-bottom: 5px;
            }

        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            text-align: center;
            font-weight: 600;
        }

        .success {
            background: #d4edda;
            color: #155724;
            display: block;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }
    </style>
</head>

<body>


    <div class="password-container">

        <h2>Create Your Password</h2>

        <p class="subtitle">
            This is your first login. Please create a secure password.
        </p>


        <div class="requirements">

            Password must contain:

            <ul>
                <li>Minimum 8 characters</li>
                <li>At least one uppercase letter</li>
                <li>At least one lowercase letter</li>
                <li>At least one number</li>
                <li>At least one special character</li>
            </ul>

        </div>


        <div id="message" class="message"></div>


        <div class="form-group">
            <label>New Password</label>
            <input type="password"
                   id="newPassword"
                   placeholder="Enter new password">
        </div>


        <div class="form-group">
            <label>Confirm Password</label>

            <input type="password"
                   id="confirmPassword"
                   placeholder="Confirm password">

        </div>


        <button onclick="changePassword()">
            Save Password
        </button>


    </div>



    <script>const API_URL = "https://localhost:44366/api";


// Get lecturer details saved during login

const lecturer =
    JSON.parse(localStorage.getItem("lecturer") || "{}");


const email = lecturer.email;



async function changePassword()
{

    const password =
        document.getElementById("newPassword").value;


    const confirm =
        document.getElementById("confirmPassword").value;



    if(!password || !confirm)
    {
        showMessage(
            "Please fill all fields",
            "error"
        );
        return;
    }


    if(password !== confirm)
    {
        showMessage(
            "Passwords do not match",
            "error"
        );
        return;
    }



    const strong =
        password.length >= 8 &&
        /[A-Z]/.test(password) &&
        /[a-z]/.test(password) &&
        /[0-9]/.test(password) &&
        /[^A-Za-z0-9]/.test(password);



    if(!strong)
    {
        showMessage(
            "Password does not meet security requirements",
            "error"
        );
        return;
    }



    try
    {

        const response =
        await fetch(
            `${API_URL}/auth/change-password`,
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({

                    email:email,

                    newPassword:password

                })

            });


        const data =
            await response.json();



        if(data.success)
        {

            showMessage(
                "Password changed successfully. Redirecting...",
                "success"
            );


            setTimeout(()=>{

                window.location.href =
                    "lecturer-dashboard.html";

            },1500);


        }
        else
        {

            showMessage(
                data.message,
                "error"
            );

        }



    }
    catch(error)
    {

        showMessage(
            error.message,
            "error"
        );

    }

}



function showMessage(text,type)
{

    const box =
        document.getElementById("message");


    box.textContent=text;

    box.className =
        "message " + type;

}</script>


</body>
</html>
