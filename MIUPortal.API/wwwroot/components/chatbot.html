<div id="miu-chatbot-container">

    <!-- Floating Button -->
    <button id="chat-toggle">
        💬
    </button>

    <!-- Chat Window -->
    <div id="chat-window">

        <div class="chat-header">

            <div>

                <h3>🤖 MIU Smart Assistant</h3>

                <small>Always here to help</small>

            </div>

            <button id="close-chat">
                ✖
            </button>

        </div>

        <div id="chat-body">

            <div class="bot-message">

                👋 Hello!

                <br><br>

                Welcome to the MIU Portal.

                <br><br>

                Ask me anything about admissions, fees, registration, examinations, results or portal usage.

            </div>

        </div>

        <div class="quick-actions">

            <button class="quick-btn">📚 Courses</button>

            <button class="quick-btn">📊 Results</button>

            <button class="quick-btn">💰 Fees</button>

            <button class="quick-btn">📅 Timetable</button>

        </div>

        <div class="chat-footer">

            <input type="text"
                   id="chat-input"
                   placeholder="Type your question..." />

            <button id="send-chat">

                ➤

            </button>

        </div>

    </div>

</div>
